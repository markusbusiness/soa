x-flight-api-key: &flight-api-key ${FLIGHT_SERVICE_API_KEY:-dev-flight-service-key-change-me}

x-redis-sentinels: &redis-sentinels ${REDIS_NET_PREFIX:-10.203.0}.21:26379,${REDIS_NET_PREFIX:-10.203.0}.22:26379,${REDIS_NET_PREFIX:-10.203.0}.23:26379

x-redis-sentinel: &redis-sentinel
  image: redis:7.4-alpine
  entrypoint: ["sh", "/sentinel-entrypoint.sh"]
  environment:
    REDIS_MASTER_NAME: mymaster
    REDIS_MASTER_IP: ${REDIS_NET_PREFIX:-10.203.0}.10
  volumes:
    - ./redis/sentinel-entrypoint.sh:/sentinel-entrypoint.sh:ro
  depends_on:
    redis-master:
      condition: service_healthy
  healthcheck:
    test: ["CMD", "redis-cli", "-p", "26379", "ping"]
    interval: 2s
    timeout: 3s
    retries: 30

services:
  flight-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: flights
      POSTGRES_USER: flights
      POSTGRES_PASSWORD: flights
    volumes:
      - flight-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U flights -d flights"]
      interval: 2s
      timeout: 3s
      retries: 30

  flight-migrations:
    image: flyway/flyway:11-alpine
    command: -url=jdbc:postgresql://flight-db:5432/flights -user=flights -password=flights -connectRetries=30 migrate
    volumes:
      - ./flight-service/db/migration:/flyway/sql:ro
    depends_on:
      flight-db:
        condition: service_healthy

  booking-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: bookings
      POSTGRES_USER: bookings
      POSTGRES_PASSWORD: bookings
    volumes:
      - booking-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bookings -d bookings"]
      interval: 2s
      timeout: 3s
      retries: 30

  booking-migrations:
    image: flyway/flyway:11-alpine
    command: -url=jdbc:postgresql://booking-db:5432/bookings -user=bookings -password=bookings -connectRetries=30 migrate
    volumes:
      - ./booking-service/db/migration:/flyway/sql:ro
    depends_on:
      booking-db:
        condition: service_healthy

  redis-master:
    image: redis:7.4-alpine
    command: ["redis-server", "--appendonly", "yes"]
    networks:
      redis:
        ipv4_address: ${REDIS_NET_PREFIX:-10.203.0}.10
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 30

  redis-replica:
    image: redis:7.4-alpine
    command: ["redis-server", "--appendonly", "yes", "--replicaof", "${REDIS_NET_PREFIX:-10.203.0}.10", "6379"]
    networks:
      redis:
        ipv4_address: ${REDIS_NET_PREFIX:-10.203.0}.11
    depends_on:
      redis-master:
        condition: service_healthy

  redis-sentinel-1:
    <<: *redis-sentinel
    networks:
      redis:
        ipv4_address: ${REDIS_NET_PREFIX:-10.203.0}.21

  redis-sentinel-2:
    <<: *redis-sentinel
    networks:
      redis:
        ipv4_address: ${REDIS_NET_PREFIX:-10.203.0}.22

  redis-sentinel-3:
    <<: *redis-sentinel
    networks:
      redis:
        ipv4_address: ${REDIS_NET_PREFIX:-10.203.0}.23

  flight-service:
    build:
      context: .
      dockerfile: flight-service/Dockerfile
    environment:
      DATABASE_URL: postgresql://flights:flights@flight-db:5432/flights
      FLIGHT_SERVICE_API_KEY: *flight-api-key
      GRPC_PORT: 50051
      REDIS_SENTINELS: *redis-sentinels
      REDIS_MASTER_NAME: mymaster
      CACHE_TTL_SECONDS: ${CACHE_TTL_SECONDS:-300}
    ports:
      - "${FLIGHT_GRPC_PORT:-50051}:50051"
    networks: [default, redis]
    depends_on:
      flight-migrations:
        condition: service_completed_successfully
      redis-sentinel-1:
        condition: service_healthy
      redis-sentinel-2:
        condition: service_healthy
      redis-sentinel-3:
        condition: service_healthy
    restart: unless-stopped

  booking-service:
    build:
      context: .
      dockerfile: booking-service/Dockerfile
    environment:
      DATABASE_URL: postgresql://bookings:bookings@booking-db:5432/bookings
      FLIGHT_SERVICE_ADDRESS: flight-service:50051
      FLIGHT_SERVICE_API_KEY: *flight-api-key
      GRPC_TIMEOUT_SECONDS: ${GRPC_TIMEOUT_SECONDS:-2}
      RETRY_MAX_ATTEMPTS: ${RETRY_MAX_ATTEMPTS:-3}
      RETRY_BASE_DELAY_MS: ${RETRY_BASE_DELAY_MS:-100}
      RETRY_BACKOFF_MULTIPLIER: ${RETRY_BACKOFF_MULTIPLIER:-2}
      CB_FAILURE_THRESHOLD: ${CB_FAILURE_THRESHOLD:-5}
      CB_WINDOW_SECONDS: ${CB_WINDOW_SECONDS:-30}
      CB_OPEN_TIMEOUT_SECONDS: ${CB_OPEN_TIMEOUT_SECONDS:-15}
      PENDING_RESERVATION_TIMEOUT_SECONDS: ${PENDING_RESERVATION_TIMEOUT_SECONDS:-60}
      SWEEPER_INTERVAL_SECONDS: ${SWEEPER_INTERVAL_SECONDS:-10}
    ports:
      - "${BOOKING_PORT:-8000}:8000"
    depends_on:
      booking-migrations:
        condition: service_completed_successfully
      flight-service:
        condition: service_healthy
    restart: unless-stopped

  tests:
    profiles: [test]
    build:
      context: .
      dockerfile: tests/Dockerfile
    environment:
      BOOKING_URL: http://booking-service:8000
      BOOKING_DATABASE_URL: postgresql://bookings:bookings@booking-db:5432/bookings
      FLIGHT_SERVICE_ADDRESS: flight-service:50051
      FLIGHT_SERVICE_API_KEY: *flight-api-key
      REDIS_SENTINELS: *redis-sentinels
      REDIS_MASTER_NAME: mymaster
    networks: [default, redis]
    depends_on:
      booking-service:
        condition: service_healthy

networks:
  redis:
    ipam:
      config:
        - subnet: ${REDIS_NET_PREFIX:-10.203.0}.0/24

volumes:
  flight-pgdata:
  booking-pgdata:
