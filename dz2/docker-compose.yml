services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: marketplace
      POSTGRES_USER: marketplace
      POSTGRES_PASSWORD: marketplace
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U marketplace -d marketplace"]
      interval: 2s
      timeout: 3s
      retries: 30

  flyway:
    image: flyway/flyway:11-alpine
    command: -url=jdbc:postgresql://postgres:5432/marketplace -user=marketplace -password=marketplace -connectRetries=30 migrate
    volumes:
      - ./db/migration:/flyway/sql:ro
    depends_on:
      postgres:
        condition: service_healthy

  app:
    build:
      context: .
      target: runtime
    environment:
      DATABASE_URL: postgresql://marketplace:marketplace@postgres:5432/marketplace
      JWT_SECRET: ${JWT_SECRET:-dev-only-secret-change-me-0123456789abcdef}
      ACCESS_TOKEN_TTL_MINUTES: 15
      REFRESH_TOKEN_TTL_DAYS: 7
      ORDER_RATE_LIMIT_MINUTES: ${ORDER_RATE_LIMIT_MINUTES:-1}
      ADMIN_EMAIL: admin@marketplace.local
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-admin12345}
    ports:
      - "${APP_PORT:-8080}:8080"
    depends_on:
      flyway:
        condition: service_completed_successfully
    restart: unless-stopped

  tests:
    profiles: [test]
    build:
      context: .
      target: test
    environment:
      DATABASE_URL: postgresql://marketplace:marketplace@postgres:5432/marketplace
      JWT_SECRET: test-secret-0123456789abcdef0123456789
    depends_on:
      flyway:
        condition: service_completed_successfully

volumes:
  pgdata:
