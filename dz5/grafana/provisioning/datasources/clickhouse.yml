apiVersion: 1

datasources:
  - name: ClickHouse
    type: grafana-clickhouse-datasource
    uid: clickhouse
    isDefault: true
    editable: false
    jsonData:
      host: clickhouse
      port: 8123
      protocol: http
      username: grafana
      defaultDatabase: analytics
    secureJsonData:
      password: $CLICKHOUSE_GRAFANA_PASSWORD
